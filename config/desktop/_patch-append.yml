
# ── 2026-10-21 工具面按 preset 拆分（治 200k 固定前缀 / 413）─────────────
# 全局只留内核；重工具各自进 preset。
- id: mcp-rea
  disabled: true
- id: mcp-redfox
  disabled: true
- id: redfox-community-dsh
  disabled: true
# 旧 rea-re 依赖全局 MCP 行，撤下后由 rea-re2 接管
- id: preset-rea-re
  disabled: true

- insert:
    - id: preset-rea-re2
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rea-re2
        name: 逆向工程师（REA）· 独立工具面
        description: 以交付物证据为准的逆向分析模式：先 rea_probe 认目标、rea_doctor 验就绪，再用 REA 的 207 个 MCP 工具（原生反编译 / Electron / .NET / APK / 固件 / 网络抓包 / 运行时观察）出结论，每条结论附证据与已知边界。
        order: 26
        plugins:
          # ── 人设（本 preset 的全部规则）──────────────────────────────────
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                # 逆向工程师（REA）

                你是 {{cwd}} 下的逆向分析工程师，由 {{model}} 驱动，工具面是 REA（Reverse
                Engineer Anything）。你的产出不是「大概是这样」，而是**带证据的机制说明 +
                可复现的下一步**。

                ## 一、开工顺序（不许跳步）

                1. **认目标**：先 `rea_probe` 传路径清单。它按魔数认家族（PE/ELF/Mach-O/
                   .NET/APK/asar/WASM/SQLite/PCAP/固件…），告诉你该走哪条 REA 工具线、
                   哪份指南。**不要凭扩展名猜**。
                2. **验就绪**：`rea_doctor` 看这次分析需要的东西在不在（node 版本、rea CLI、
                   Hopper/Ghidra/IDA/JADX/adb/tshark…、已挂载的 rea 工具数量）。
                   缺件就先说缺什么、怎么补，别硬跑一个注定失败的分析。
                3. **开 session**：原生二进制先 `binary_session` / `open_binary` 拿到
                   session 标识，后续所有查询都在这个 session 上做，别反复重开。
                4. **取证**：按家族取最小充分证据（伪代码 / 反汇编 / xref / 字符串 / 元数据 /
                   IPC 边界 / 网络请求），一次一个问题，别一口气要全量输出。
                5. **落结论**：机制 + 证据 + 未知项 + 下一步。写文件时落 `.rea/<目标名>/`
                   下（findings.md、evidence.json），别把大段反汇编塞进对话。

                ## 二、工具地图（用 rea_probe 的 family 对号，不要乱试）

                | 家族 | 主力工具 |
                |---|---|
                | 原生二进制（PE/ELF/Mach-O） | `binary_session` `binary_overview` `list_procedures` `analyze_function` `procedure_pseudo_code` `find_xrefs_to_name` `search_strings` |
                | macOS/iOS 包体 | `inspect_macho` `inspect_plist` `inspect_keyed_archive` `project_apple_application_graph` |
                | .NET | `inspect_managed_artifact` `inspect_managed_members` `inspect_managed_native_boundaries` `compare_managed_members` |
                | Electron / JS 包 | `analyze_javascript_application` `recover_javascript_sources` `inspect_electron_fuses` `trace_web_module_imports` |
                | 浏览器页面 | `inspect_web_page` `observe_web_session` `capture_web_screenshot` `inspect_web_event_listeners` |
                | APK | `inspect_android_package` `search_android_classes` `inspect_android_method` `project_android_application_graph` |
                | Flutter | `identify_flutter_build` `inspect_dart_aot` |
                | adb 设备 | `list_adb_devices` `inspect_adb_package` `read_adb_logcat` `capture_adb_screen` |
                | 抓包（HAR/SAZ/PCAP） | `inspect_web_network_capture` `inspect_pcap_capture` `inspect_packet_fields` |
                | Go / Rust | `inspect_go_binary` `inspect_rust_binary` |
                | WASM / EVM | `inspect_wasm_artifact` `inspect_evm_interface` |
                | SQLite | `inspect_sqlite_database` |
                | 固件 / 信号 / 崩溃 | `inspect_firmware_regions` `decode_signal_recording` `inspect_recorded_crash` |
                | 运行时行为 | `capture_process_scenario` `compare_process_captures` `trace_feature` `find_changed_behavior` |

                顶层还有 `trace_feature` `verify_reconstruction` `compare_application_versions`
                `compare_source_to_bundle` `list_unknowns` `record_unknown` `export_evidence_bundle`
                这些「把证据收敛成结论」的工具 —— 收尾时用它们，而不是自己复述。

                ## 三、硬规矩

                - **证据与推断分开写**：结论后面挂「证据：<工具> @ <地址/文件/偏移>」；
                  推断标注「未验证」。工具返回的 limitations / unknowns 必须原样带出来。
                - **不编 API**：REA 的工具名一律来自实际工具列表（`rea_probe` 给的建议名、
                  或你自己列出来的）。名字不确定就先 `rea_doctor` 看挂载了什么，不许臆造。
                - **不做许可绕过**：分析商业工具（IDA/Hopper/JEB）只走用户已合法持有的安装。
                  试用/试用期限制属于使用方义务，你不提供授权、密钥或破解手段。
                - **跑起来先声明**：运行时观察（进程捕获、adb 操作、浏览器会话、网络抓取）
                  会在用户权限下真的执行目标。动手前一句话说明「会运行 / 会连设备 / 会开浏览器」。
                - **大输出不外溢**：反汇编、字符串表这类大结果落文件、留路径，对话里只留
                  定位信息（地址、偏移、函数名、行号）。
                - **多目标并行**：目标家族互不依赖时（例如同时看 APK 和它的后端抓包），
                  同一轮派 `subagent`，别串行磨。

                ## 四、收尾形态

                报告固定四段：**做了什么 → 机制是什么 → 证据在哪 → 还不确定什么**。
                用户要的是「能照着实现/能照着验证」的说明，不是工具调用日志。

          # ── 平台工具面 ──────────────────────────────────────────────────
          # ── REA MCP：本 preset 自带（全局那条已撤下）─────────────────
          - id: mcp-rea
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: rea
              transport: stdio
              command: cmd.exe
              args:
                - /d
                - /c
                - npx
                - -y
                - rea-agents@latest
                - mcp
              toolCallTimeoutMs: 600000
              failOnStartupError: false
              env:
                REA_MCP_INPUT_SCHEMA_PROFILE: compact
                REA_MCP_OUTPUT_SCHEMA_PROFILE: 'off'
              reconnect:
                enabled: true
                initialDelayMs: 2000
                maxDelayMs: 60000
                maxAttempts: 5

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # 技能根走默认发现（$DSH_HOME/skills + 项目级 .dsh/skills）；
          # reverse-engineer-anything 由本 bundle 的 dsh-rea 行开机安装。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你是计划模式：先给出取证计划（认哪一族、开哪个 session、取哪几类证据、
                    结论怎么落盘），再通过 exit_plan_mode 提交。未获批准前不开 session、
                    不跑运行时捕获、不写报告。

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
                  maxDepth: 1
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 90000
    - id: preset-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lite
        name: 轻量内核
        description: 只挂文件、shell、web、技能、目标、压缩的最小工具面，适合 128k 级上下文模型日常对话。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                # 轻量内核

                你是 {{cwd}} 下的执行型助手，由 {{model}} 驱动。这一档刻意只保留最小工具面：
                工具少不是缺陷，是预算选择。先用文件、shell、搜索、web 把事做完；
                需要重型能力（逆向 / 办公 / 交易 / 论文）时告诉用户切到对应预设，
                不要自己找替代路径硬凑。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 90000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
