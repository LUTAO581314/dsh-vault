# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: desktop-shell
  name: dsh-plugin-desktop
  config:
    mode: advanced
    macosMaterial: transparent
    windowsMaterial: off
    openBrowser: false
    networkExposure: loopback
    developerLogging: true
    logLevel: debug
- id: desktop-notifications
  name: dsh-plugin-desktop/notifications
  config:
    enabled: true
    notifyOnTurnCompletion: true
    notifyOnTurnFailure: true
    notifyOnJobCompletion: true
    notifyOnJobFailure: true
    notifyOnScheduleCompletion: true
    notifyOnScheduleFailure: true
- id: plugin-market
  config:
    indexes:
      - https://cdn.jsdelivr.net/gh/realguan/dsh-plugin-market@dist/dsh-index.json
# 插件市场只留一套 = 官方那套（2026-10-22 21:42 决定）：
# - 官方「发现」页重新打开（它自带索引源管理 = 手动换源），数据源仍走宿主 plugin-market 服务
# - dsh-community-market 的 tab / 侧栏 footer 按钮 / overlay 全部关掉（它才是重复的那个 UI）
# - dshmarket 关掉（它的 settings 页与 market 服务当前并未真正起来，留着只会再长出一个市场）
- id: community-market
  name: dsh-community-market
  disabled: true
- id: dsh-market
  name: dshmarket
  disabled: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: standard
- id: preset-studio
  name: dsh-agent-preset-editor
  config:
    modules: '[{"id":"base","section":"pack:base","order":0,"file":"base.md","presets":"*","enabled":true}]'
    request: '{"nonce":4,"op":"setPluginEnabled","presetId":"standard","moduleName":"@deepseek-ai/dsh-time-context","enabled":true}'
- id: preset-standard
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: "@deepseek-ai/dsh-persona"
        config:
          prefix: ""
      - id: agent-instructions
        name: "@deepseek-ai/dsh-agent-instructions"
        config:
          maxBytes: 65536
      - id: time-context
        name: "@deepseek-ai/dsh-time-context"
      - id: tool-bash
        name: "@deepseek-ai/dsh-tool-bash"
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: "@deepseek-ai/dsh-tool-pwsh"
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: "@deepseek-ai/dsh-tool-fs"
      - id: tool-fs-search
        name: "@deepseek-ai/dsh-tool-fs-search"
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: "@deepseek-ai/dsh-tool-jobs"
      - id: tool-schedule
        name: "@deepseek-ai/dsh-tool-schedule"
      - id: skill-filesystem
        name: "@deepseek-ai/dsh-skill-filesystem"
        config:
          includeDefaultRoots: true
          customSkillDirs: []
      - id: tool-skill
        name: "@deepseek-ai/dsh-tool-skill"
      - id: command-goal
        name: "@deepseek-ai/dsh-command-goal"
      - id: tool-goal
        name: "@deepseek-ai/dsh-tool-goal"
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: "@deepseek-ai/dsh-plan-mode"
            config:
              section: >
                You are in plan mode. Stay in plan mode until the user approves
                your plan through exit_plan_mode or switches the session mode.
                Imperative language to implement changes means plan the
                implementation, not execute it. When the operator explicitly
                asks you to implement now, treat that as authorization to
                execute; exit plan mode or proceed with mutation tools as the
                operator directs. # [dsh-purge] plan-mode soft block removed


                Explore first. Use non-mutating reads, searches, static
                analysis, and checks to ground the plan in the actual
                repository. Explore first with reads and analysis; when the
                operator requires changes, use mutation tools to carry out the
                plan — do not refuse implementation because plan mode is active.
                # [dsh-purge] plan-mode soft block removed Prefer existing
                functions and patterns over new machinery.


                The tool catalog stays the same across modes for request-cache
                stability. These plan-mode rules override any later tool
                description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do
                not use todo_write to track this planning phase: it tracks
                implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.


                Resolve discoverable facts by inspection. Use ask_user_question
                only for user-owned choices or material ambiguity that
                inspection cannot answer. Do not ask the user where code lives
                or how current behavior works when you can find out.


                Make the plan decision-complete: state the goal and success
                criteria; group implementation changes by subsystem; identify
                public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit
                assumptions. Keep it concise enough to review but detailed
                enough that another engineer can implement it without making
                design decisions.


                When ready, call exit_plan_mode with the complete plan markdown,
                starting with a # title. Make exit_plan_mode the only and final
                tool call in that assistant response: it presents the plan for
                approval, and implementation begins only in a later step after
                approval. Do not paste the final plan as a plain reply or ask
                "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again.
                If the review channel is unavailable or aborted, stay in plan
                mode and ask the user to switch modes manually; proceed with
                implementation when the operator requires it. # [dsh-purge]
                plan-mode soft block removed
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: "@deepseek-ai/dsh-compaction-basic"
          - id: command-compact
            name: "@deepseek-ai/dsh-command-compact"
          - id: tool-result-pruner
            name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: "@deepseek-ai/dsh-tool-subagent-control"
          - id: tool-subagent-list-agents
            name: "@deepseek-ai/dsh-tool-subagent-control/list-agents"
          - id: tool-subagent
            name: "@deepseek-ai/dsh-tool-subagent"
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
          - id: tool-subagent-fork
            name: "@deepseek-ai/dsh-tool-subagent"
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: "@deepseek-ai/dsh-workflow-ptc"
            config:
              provider: spawn
          - id: tool-workflow
            name: "@deepseek-ai/dsh-tool-workflow"
      - id: tool-ask-user
        name: "@deepseek-ai/dsh-tool-ask-user"
      - id: tool-todo
        name: "@deepseek-ai/dsh-tool-todo"
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: "@deepseek-ai/dsh-tool-web"
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: "@deepseek-ai/dsh-tool-present"
      - id: tool-plugin-manager
        name: "@deepseek-ai/dsh-plugin-manager/tools"
        disabled: true
      - id: tool-plugin-market
        name: "@deepseek-ai/dsh-plugin-market/tools"
        disabled: true
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      synapse:
        displayName: synapse
        models:
          - id: gpt-6-astra
            name: gpt-6-astra
            input: []
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
          - id: gpt-6.1-sol
            name: gpt-6.1-sol
            input: []
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
