# dsh-multizen-browser bundle patch
#
# Mounts the host half of the MultiZen-backed sidebar browser. The plugin owns
# two webserver routes:
#
#   GET /multizen-view   the viewer page (canvas + address bar + click/scroll/key
#                        forwarding) that the sidebar's own `browser` tab loads
#                        in its iframe. Same-origin, so it is not subject to the
#                        X-Frame-Options that make real sites refuse to embed.
#   WS  /multizen-cdp    a CDP bridge to the MultiZen Chromium (127.0.0.1:9222):
#                        Page.startScreencast frames down, DOM-synthesized
#                        input up.
#
# Because the sidebar's `browser` tab is the host's own kind (an iframe pointed
# at a URL), pointing it at /multizen-view is what makes every sidebar browser
# open land in the fingerprint browser.
- insert:
    - id: multizen-browser
      name: 'dsh-multizen-browser'
      config:
        cdpEndpoint: 'http://127.0.0.1:9222'
        # MultiZen's CloakBrowser swallows the DevTools Input domain, so clicks
        # and keys are synthesized in the page through Runtime.evaluate.
        inputMode: 'dom'
        quality: 72
        maxWidth: 1600
        maxHeight: 1200
