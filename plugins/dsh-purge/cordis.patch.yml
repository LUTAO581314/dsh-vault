# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# [2026-10-21 修] 原来这里有 5 条“关掉旧的独立红队包行（若用户以前装过）”。
# 这些包（dsh-redteam-store/ui/mode/mode-store/mode-ui）在本 profile 里从未安装，
# 补丁目标不存在，于是每次 compose 都打 5 条
#   [W] [root] patch: entry "redteam-XXX" not found
# 包没装就不需要关。整段注释，将来真装了再解开。
#- id: redteam-store
#  name: dsh-redteam-store
#  disabled: true
#
#- id: redteam-ui
#  name: dsh-redteam-ui
#  disabled: true
#
#- id: redteam-mode
#  name: dsh-redteam-mode
#  disabled: true
#
#- id: redteam-mode-store
#  name: dsh-redteam-mode/store
#  disabled: true
#
#- id: redteam-mode-ui
#  name: dsh-redteam-mode/ui
#  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# [2026-10-21 修] 原这里还有一条 `- id: dsh-purge` + `inject: [systemPrompt, tools]`。
# dsh-purge 本身是由下面的 insert 添加的，补丁先于它执行 → 必然 not found。
# inject 已经写在 insert 条目里，这条补丁纯属空转，删除。
- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui